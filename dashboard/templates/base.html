<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Industrial Control Agent{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-gear-wide-connected me-2"></i>Mixer3 Control Agent
            </a>
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                    <i class="bi bi-speedometer2 me-1"></i>Overview
                </a>
                <a class="nav-link {% if request.path == '/actions' %}active{% endif %}" href="/actions">
                    <i class="bi bi-lightning-charge me-1"></i>Actions
                    <span id="nav-pending-badge" class="badge bg-warning text-dark ms-1 d-none">0</span>
                </a>
                <a class="nav-link {% if request.path == '/production' %}active{% endif %}" href="/production">
                    <i class="bi bi-bar-chart-line me-1"></i>Production
                </a>
                <a class="nav-link {% if request.path == '/alarms' %}active{% endif %}" href="/alarms">
                    <i class="bi bi-exclamation-triangle me-1"></i>Alarms
                </a>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-3">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
